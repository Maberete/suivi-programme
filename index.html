<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f5f0">
<title>Ma vie</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--card:#fffdf9;--beige:#efeadf;--seg:#d6cfbf;--text:#1f1e1b;--mut:#8a867b;--line:#e8e3d8;--g:#3f7d5c;--gs:#e4efe8}
@media(prefers-color-scheme:dark){:root{--bg:#121210;--card:#1b1b18;--beige:#26251f;--seg:#4a483f;--text:#f1efe8;--mut:#9a968a;--line:#2b2a25;--g:#7fc29a;--gs:#1f2d25}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,sans-serif}
body{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 22px calc(110px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-size:16px;color:var(--mut);margin:0 0 26px}
.lbl{font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.amt{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:52px;letter-spacing:-.025em;line-height:1;margin:0 0 26px}
.title{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:36px;margin:0 0 22px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:12px;transition:transform .2s;display:block;width:100%;color:inherit;text-align:left;font:inherit}
.v{font-family:Fraunces,Georgia,serif;font-size:28px}
.gt{font-size:19px;font-weight:500}
.sub{color:var(--mut);font-size:14px;line-height:1.55;margin:0}
.adv{font-size:17px;line-height:1.5;margin:0 0 10px}
.bar{height:6px;background:var(--beige);border-radius:6px;overflow:hidden;margin:14px 0 10px}
.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.split{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:8px}
.btn{border:0;background:var(--text);color:var(--bg);border-radius:16px;padding:15px;font:500 15px 'DM Sans',sans-serif;width:100%;transition:transform .15s,opacity .2s}
.btn.g{background:var(--g);color:#fff}.btn.o{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:active,.card:active,.obj:active{transform:scale(.985)}
input,select{font:16px 'DM Sans',sans-serif;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;margin-top:6px}
input:focus,select:focus{outline:2px solid var(--g);border-color:transparent}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--g);margin:10px 0 4px}
.f{display:block;margin-top:14px;font-size:12px;color:var(--mut)}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:9px 15px;font:14px 'DM Sans',sans-serif;transition:all .2s}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);gap:10px}
.row:first-child{border-top:0}.row b{font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:10px}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:0 4px 0 10px}
.dnw{position:relative;width:210px;height:210px;margin:4px auto 24px}.dnw svg{width:100%;height:100%}
.dnw circle{fill:none;stroke-width:13}.seg{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dc b{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:32px}
.goal{cursor:pointer}
.gh{display:flex;align-items:center;gap:14px}.gh>div{flex:1}.em{font-size:28px}.pct{font-family:Fraunces,Georgia,serif;font-size:22px}
.sl label{display:flex;justify-content:space-between;font-size:14px;margin-top:16px}
.sim{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.seg2{display:flex;background:var(--beige);border-radius:14px;padding:4px;margin-bottom:20px}
.seg2 button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:11px;font:500 14px 'DM Sans',sans-serif;transition:all .25s}
.seg2 button.on{background:var(--card);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.ck{display:flex;align-items:center;gap:14px;padding:14px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;color:inherit;font:inherit;text-align:left}
.ck:first-child{border-top:0}
.cb{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--seg);display:grid;place-items:center;transition:all .3s}
.cb svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .4s .08s}
.ck.done .cb{background:var(--g);border-color:var(--g);transform:scale(1.08)}.ck.done .cb svg{stroke-dashoffset:0}
.ck.done .tx{color:var(--mut);text-decoration:line-through}
.tx{flex:1;min-width:0}.tx small{display:block;color:var(--mut);font-size:13px;margin-top:2px;text-decoration:none}
.tm{width:48px;font-size:13px;color:var(--mut);flex:0 0 48px}
.fxr{display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--line);color:var(--mut);font-size:15px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.dy{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0;text-align:center;color:var(--text);font:12px 'DM Sans',sans-serif;transition:all .25s}
.dy b{display:block;font-size:16px;font-weight:500;margin-top:3px}.dy.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.hb{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:14px}.hb span{width:96px}.hb .bar{flex:1;margin:0}.hb b{width:58px;text-align:right;font-weight:500}
.rg{width:92px;height:92px;position:relative;flex:0 0 92px}.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:8}.rg b{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-weight:400;font-size:24px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:13px 14px;margin-top:8px;font:15px 'DM Sans',sans-serif;transition:all .25s}
.opt.ok{background:var(--g);color:#fff;border-color:var(--g)}.opt.ko{opacity:.45}
.pill{font-size:12px;border-radius:99px;padding:6px 12px;background:var(--beige);color:var(--mut);border:0;font-family:'DM Sans',sans-serif;white-space:nowrap}
.pill.s1{color:var(--text)}.pill.s2,.pill.s3{background:var(--gs);color:var(--g)}.pill.s4{background:var(--g);color:#fff}
.ex{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}.ex:first-of-type{border-top:0}.ex span:last-child{color:var(--mut);white-space:nowrap}
.obj{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;width:100%;color:inherit;text-align:left;font:inherit;transition:transform .2s}
.obj>div{flex:1}.obj b{font-weight:500;font-size:17px}.obj .sub{margin-top:3px}
.ln svg{width:100%;height:130px;display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px 'DM Sans',sans-serif;padding:4px 10px;transition:color .25s,transform .15s}
nav button.on{color:var(--g)}nav button:active{transform:scale(.9)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#ov{position:fixed;inset:0;background:rgba(20,20,15,.38);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:12px 22px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:61}
#sh.on{transform:none}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 20px}
.sht{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:26px;margin:0 0 6px}
.hd{font-family:Fraunces,Georgia,serif;font-size:20px;margin:24px 0 6px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes pop{from{opacity:.2;transform:translateY(5px)}}
.pop{animation:pop .35s ease both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav>
 <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
 <button data-tab="money"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>Argent</button>
 <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Planning</button>
 <button data-tab="obj"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6"/></svg>Objectifs</button>
 <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
</nav>
<div id="ov"></div><div id="sh"></div>
<script>
const $=s=>document.querySelector(s);
const K='finance-v2';
const P0={name:'',age:'',h:'',w0:'',w:'',goal:'',lvl:'Débutante / reprise',rel:'',start:'',
 cfg:{wake:'07:00',cs:'08:45',ce:'16:45',bs:'18:00',be:'19:30',baby:[0,1,3],cor:'10:00',core:'12:00',sd:{A:4,B:5,C:6},st:{A:'18:00',B:'14:30',C:'10:30'}},
 wk:{},c:{},mv:{},sk:{},wt:[],ms:[],steps:{},el:'A1',cy:{},cu:{},qz:{},cq:{}};
let S={name:'',inc:0,bal:0,exp:[],goals:[]},tab='home',GT='Voyage',EG=null,CS=null,argT='b',selD=new Date(),stR='w',qo=0;
try{const r=JSON.parse(localStorage.getItem(K));if(r)S={...S,...r}}catch(e){}
S.p={...P0,...(S.p||{}),cfg:{...P0.cfg,...((S.p||{}).cfg||{}),sd:{...P0.cfg.sd,...(((S.p||{}).cfg||{}).sd||{})},st:{...P0.cfg.st,...(((S.p||{}).cfg||{}).st||{})}}};
selD.setHours(0,0,0,0);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const num=v=>{const a=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return a>0?a:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=new Date();TODAY.setHours(0,0,0,0);
if(!S.p.start){S.p.start=iso(TODAY);save()}
const NOW=new Date(),mi=d=>d.getFullYear()*12+d.getMonth(),ym=s=>+s.slice(0,4)*12+(+s.slice(5,7)-1);
const lab=i=>new Date(Math.floor(i/12),i%12,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const DN=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],DL=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const dIdx=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
// ---------- données ----------
const SCHOOL=['2026-10-19','2026-11-09','2026-11-30','2027-01-04','2027-01-25','2027-02-15','2027-03-08','2027-03-29','2027-04-19','2027-05-10','2027-05-31','2027-06-14','2027-06-21','2027-06-28','2027-07-05'];
const SESS={A:{n:'Haut du corps',m:45,r:60,ex:[['Pompes (sur genoux si besoin)',12],['Rowing haltère',12],['Développé épaules',12],['Tirage élastique ou barre',12],['Curl biceps',12]]},
B:{n:'Bas du corps',m:45,r:60,ex:[['Squat',15],['Fentes alternées',12],['Hip thrust',15],['Soulevé de terre roumain',12],['Mollets debout',15]]},
C:{n:'Complet et gainage',m:40,r:45,ex:[['Circuit squat, pompes, rowing',10],['Planche',30,'s'],['Gainage latéral',20,'s'],['Crunchs lents',15],['Mobilité et étirements',5,'min',1]]},
D:{n:'Cardio : marche rapide',m:30,r:0,ex:[['Marche rapide',25,'min',1],['Mobilité',5,'min',1]]}};
const MIC={en1:['Vocabulaire',15],en2:['Écoute',15],en3:['Lecture',10],en4:['Conversation et prononciation',10],en5:['Grammaire',15],en6:['Écriture',10]};
const SK={en2:'Listening',en4:'Speaking',en3:'Reading',en6:'Writing',en1:'Vocabulary',en5:'Grammar'};
const LV=['Débutant','A1','A2','B1','B2'];
const CY=[['Réseaux',['Modèle OSI','TCP/IP','IPv4 / IPv6','Adressage IP','Subnetting','ARP','ICMP','DHCP','DNS','NAT','VLAN','Trunk','Routage','ACL','Wireshark']],
['Systèmes',['Windows','Windows Server','Active Directory','Utilisateurs et groupes','Permissions','GPO','DNS / DHCP Windows Server','Linux','Ubuntu','Commandes Linux','Gestion des utilisateurs','Permissions Linux','Services','Processus','Logs','SSH']],
['Virtualisation',['VMware','VirtualBox','Machines virtuelles','Réseaux virtuels','Snapshots','Environnement de laboratoire']],
['Cybersécurité',['CIA Triad','Authentification','Contrôle d’accès','Chiffrement','Vulnérabilités','Sécurité réseau','Firewall','SIEM','Logs et détection','Réponse à incident','Sécurité Windows / Linux']],
['Pratique',['Projet 1 · Petit réseau virtuel','Projet 2 · Windows Server et domaine AD','Projet 3 · Utilisateurs et GPO','Projet 4 · Linux : utilisateurs et permissions','Projet 5 · Analyser du trafic avec Wireshark','Projet 6 · Petit laboratoire cybersécurité']]];
const STT=['À apprendre','En cours','Compris','Pratiqué','Maîtrisé'];
const CC=['Histoire','Géographie','Politique et institutions','Économie','Sciences','Technologie','Arts','Littérature','Philosophie','Actualité','Culture africaine','Culture française','Monde'];
const CT=[['La Révolution française','Les grandes civilisations antiques','La Seconde Guerre mondiale'],['Les principales régions d’Afrique','Les grands fleuves du monde','Les climats de la planète'],['Les trois pouvoirs en France','L’Union européenne','L’ONU et ses missions'],['Inflation et pouvoir d’achat','Comment fonctionne une banque','PIB et croissance'],['L’ADN en bref','Le système solaire','Les énergies renouvelables'],['Comment fonctionne Internet','L’intelligence artificielle, les bases','Le cloud en simple'],['Les grands courants de la peinture','De l’architecture gothique à la moderne','Le cinéma depuis 1895'],['Un classique : Les Misérables','La littérature africaine francophone','Poésie du XIXe siècle'],['Descartes et le doute','Le bonheur selon les philosophes','Liberté et responsabilité'],['Faire sa revue de presse en 10 minutes','Repérer une fausse information','Comprendre un grand titre du jour'],['Les empires du Mali et du Songhaï','Langues et musiques d’Afrique de l’Ouest','L’Union africaine'],['Les grandes dates de la République','La gastronomie française','Les institutions culturelles'],['Les grandes religions du monde','Les continents en chiffres','Alliances et traités majeurs']];
const QZ=[['En quelle année a eu lieu la prise de la Bastille ?',['1789','1815','1848'],0],['Quel est le plus long fleuve d’Afrique ?',['Le Niger','Le Nil','Le Congo'],1],['Combien d’États compte l’Union européenne ?',['27','25','30'],0],['Que mesure le PIB ?',['La richesse produite','Les prix','Le chômage'],0],['Quelle planète est la plus proche du Soleil ?',['Vénus','Mercure','Mars'],1],['Que signifie « DNS » ?',['Domain Name System','Data Network Security','Digital Name Server'],0],['Qui a peint La Joconde ?',['Michel-Ange','Raphaël','Léonard de Vinci'],2],['Qui a écrit Les Misérables ?',['Victor Hugo','Émile Zola','Balzac'],0],['Qui a dit « Je pense, donc je suis » ?',['Kant','Descartes','Platon'],1],['Face à une info choquante, quel réflexe adopter ?',['La partager vite','Vérifier la source','L’ignorer'],1],['Quelle est la capitale de la Guinée ?',['Dakar','Bamako','Conakry'],2],['Quelle est la devise de la République française ?',['Liberté, Égalité, Fraternité','Travail, Famille, Patrie','Unité, Paix, Justice'],0],['Quel est le plus grand océan ?',['Atlantique','Pacifique','Indien'],1]];
const IC={Voyage:'✈️',Achat:'🛍️',Permis:'🚗',Études:'🎓',Urgence:'🚨',Autre:'✨'};
// ---------- finance ----------
const expT=()=>S.exp.reduce((a,e)=>a+e.a,0),cap=()=>S.inc-expT();
const rem=g=>Math.max(0,g.t-g.s),mLeft=g=>Math.max(1,ym(g.d)-mi(NOW));
const need=g=>g.d?rem(g)/mLeft(g):0,eff=g=>g.m>0?g.m:need(g);
const act=()=>S.goals.filter(g=>rem(g)>0),savedT=()=>S.goals.reduce((a,g)=>a+g.s,0);
const eta=g=>eff(g)>0?lab(mi(NOW)+Math.ceil(rem(g)/eff(g))):'à définir';
function rec(){const c=cap();if(c<=0)return 0;const n=act().reduce((a,g)=>a+need(g),0);return Math.round(n>0?Math.min(n,c):Math.min(c,S.inc*.2))}
const planned=()=>{const p=act().reduce((a,g)=>a+(g.m||0),0);return p>0?p:rec()};
const prio=()=>act().sort((x,y)=>(x.d?ym(x.d):9e9)-(y.d?ym(y.d):9e9)||rem(x)-rem(y))[0];
function verdict(g){
 if(!(g.t>0))return'Indique un budget pour voir le plan.';
 if(rem(g)<=0)return'Objectif atteint 🎉';
 const r=rem(g),v=g.type==='Voyage',ce=v?'ce voyage':'ce projet',c2=Math.max(0,cap()-S.goals.filter(o=>o.id!==g.id).reduce((a,o)=>a+(o.m||0),0));
 if(g.d){const n=r/mLeft(g);
  if(g.m>0&&g.m>=n*.999)return`Tu peux te permettre ${ce} en ${lab(ym(g.d))}.`;
  if(n<=c2)return`Pour ${v?'partir':'y arriver'} en ${lab(ym(g.d))}, tu dois économiser ${eur(n)}/mois.`;
  if(c2>0)return`Avec ton budget actuel, il serait plus confortable de ${v?'partir':'viser'} en ${lab(mi(NOW)+Math.ceil(r/c2))}.`;
  return'Ajoute tes revenus et tes dépenses pour calculer ce plan.'}
 if(g.m>0)return`À ${eur(g.m)}/mois, tu y arrives en ${lab(mi(NOW)+Math.ceil(r/g.m))}.`;
 return'Ajoute une date ou un montant mensuel pour voir quand tu y arrives.'}
function anim(el,to,fmt=eur){const from=+el.dataset.v||0;el.dataset.v=to;const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(t0)}
// ---------- planning ----------
const wtype=d=>{const k=iso(monday(d));return S.p.wk[k]||(SCHOOL.includes(k)?'ecole':'hors')};
const isDone=(K,id)=>(S.p.c[K]||[]).includes(id);
const cuT=d=>{const i=dIdx(d),c=((i%13)+13)%13;return{cat:CC[c],topic:CT[c][Math.floor(i/13)%3],q:c}};
function notions(){const a=[];CY.forEach((l,i)=>l[1].forEach((n,j)=>a.push({id:i+'-'+j,n,l:i})));return a}
function nextN(){const a=notions(),s=x=>S.p.cy[x.id]||0;return a.find(x=>s(x)===1)||a.find(x=>s(x)===0)||a.find(x=>s(x)<4)||{n:'Révision générale',id:''}}
function dayPlan(dt){

function weekStats(m){const R={sport:[0,0],cyber:[0,0],en:[0,0],cult:[0,0],etu:[0,0]};let n=0,dn=0;
 for(let i=0;i<7;i++){const p=dayPlan(addD(m,i)),by={};
  p.T.forEach(t=>{n++;const ok=isDone(p.K,t.id);if(ok)dn++;
   if(t.cat==='sport'){if(t.id.startsWith('sp')){R.sport[1]++;if(ok)R.sport[0]++}}
   else if(R[t.cat]){by[t.cat]=by[t.cat]||[0,0];by[t.cat][1]++;if(ok)by[t.cat][0]++}});
  Object.keys(by).forEach(k=>{R[k][1]++;if(by[k][0]===by[k][1])R[k][0]++})}
 return{R,pct:n?Math.round(100*dn/n):0}}

 for(let d=new Date(a);d<=TODAY;d=addD(d,1)){const p=dayPlan(d);let dn=0,tn=0;
  p.T.forEach(x=>{tn++;if(isDone(p.K,x.id)){dn++;if(o.min[x.cat]!==undefined)o.min[x.cat]+=x.m;if(x.id.startsWith('sp'))o.sport++;if(x.id==='cu')o.cult++}});

function missed(){const m=monday(TODAY),a=[];for(let d=new Date(m);d<TODAY;d=addD(d,1)){const p=dayPlan(d);p.T.forEach(t=>{if(t.id.startsWith('sp')&&!isDone(p.K,t.id)&&!S.p.sk[p.K+'|'+t.d])a.push({K:p.K,k:t.d,n:SESS[t.d].n,dw:(d.getDay()+6)%7})})}return a[0]}

function sessHtml(k){const s=SESS[k],n=sets();return`<p class="lbl" style="margin-top:6px">${s.m} min${s.r?' · repos '+s.r+' s':''}</p><h3 class="sht">${s.n}</h3><div style="margin-top:12px">`+s.ex.map(e=>`<div class="ex"><span>${e[0]}</span><span>${e[3]||n} × ${e[1]}${e[2]?' '+e[2]:''}</span></div>`).join('')+'</div>'}
function sheetSport(){const p=S.p,w=p.wt.length?p.wt[p.wt.length-1].v:num(p.w),h=num(p.h),a=num(p.age);let nut='<p class="sub">Renseigne ton âge, ta taille et ton poids dans Profil pour obtenir un repère calorique.</p>';
 if(w&&h&&a){const b=10*w+6.25*h-5*a-161,t=Math.max(1500,Math.round(b*1.4*.88/10)*10);nut=`<p class="adv">≈ ${t} kcal par jour</p><p class="sub">Un déficit modéré d’environ 12 %, jamais en dessous de 1 500 kcal. Vise environ ${Math.round(w*1.4)} g de protéines par jour, 1,5 à 2 L d’eau et 8 000 pas. C’est un repère indicatif, pas un régime : mange à ta faim, et demande conseil à un professionnel de santé si tu as un doute.</p>`}

 CY.map((l,i)=>{const s=l[1].reduce((a,_,j)=>a+(S.p.cy[i+'-'+j]||0),0),pc=Math.round(100*s/(4*l[1].length));

function sheetCu(){const q=cuT(TODAY),K=iso(TODAY),st=S.p.cu[K]||[],qi=(q.q+qo)%QZ.length,Q=QZ[qi],ans=S.p.qz[K+'|'+qi];

function sheetProg(){const p=S.p,pts=[...(num(p.w0)?[{d:p.start,v:num(p.w0)}]:[]),...p.wt],K=iso(TODAY);
 let ch='<p class="sub">Entre ton poids chaque semaine pour voir ta courbe.</p>';
 if(pts.length>1){const vs=pts.map(x=>x.v),mn=Math.min(...vs)-1,mx=Math.max(...vs)+1,X=i=>10+280*i/(pts.length-1),Y=v=>110-100*(v-mn)/(mx-mn);
  ch=`<div class="ln"><svg viewBox="0 0 300 120"><polyline fill="none" stroke="var(--g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${pts.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>${pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="3.5" fill="var(--g)"/>`).join('')}</svg></div><div class="split"><span class="sub">Départ ${pts[0].v} kg</span><b>Actuel ${pts[pts.length-1].v} kg</b></div>`}
 const lm=p.ms.length?p.ms[p.ms.length-1]:null,fm=p.ms[0],ws=weekStats(monday(TODAY)),ks=Object.keys(p.steps).sort().slice(-7),av=ks.length?Math.round(ks.reduce((a,k)=>a+p.steps[k],0)/ks.length):0;
 const dl=(a,b)=>fm&&lm&&fm[b]&&lm[b]?` (${lm[b]-fm[b]>0?'+':''}${Math.round((lm[b]-fm[b])*10)/10})`:'';
 return`<h3 class="sht">📈 Ma progression</h3><p class="sub">Le poids n’est qu’un indicateur parmi d’autres.</p><p class="adv" style="margin-top:14px">Tu as réalisé ${ws.pct} % de ton objectif cette semaine.</p>
 <div class="card" style="margin-top:12px">${ch}<div class="two" style="margin-top:12px"><input id="wi" inputmode="decimal" placeholder="Poids (kg)" style="margin:0"><button class="btn g" data-act="addw">Ajouter</button></div></div>
 <p class="hd">Mensurations (cm)</p><div class="card">${lm?`<p class="sub" style="margin-bottom:10px">Dernière mesure : taille ${lm.t||'–'}${dl(0,'t')} · hanches ${lm.h||'–'}${dl(0,'h')} · cuisses ${lm.c||'–'}${dl(0,'c')}</p>`:''}<div class="two"><input id="mt" inputmode="decimal" placeholder="Taille"><input id="mh" inputmode="decimal" placeholder="Hanches"><input id="mc" inputmode="decimal" placeholder="Cuisses"></div><button class="btn o" data-act="addm" style="margin-top:10px">Enregistrer</button></div>
 <p class="hd">Activité</p>${hb('Séances faites',weekStats(monday(TODAY)).R.sport[0],weekStats(monday(TODAY)).R.sport[1]||1,weekStats(monday(TODAY)).R.sport.join('/'))}${hb('Pas moyens',av,8000,av?Math.round(av).toLocaleString('fr-FR'):'–')}`}
function sheetStats(){const o=rangeStats(stR),pc=o.tot?Math.round(100*o.done/o.tot):0,bars=o.days.slice(-14),h=n=>n>=60?Math.floor(n/60)+' h '+(n%60?String(n%60).padStart(2,'0'):''):n+' min';
 return`<h3 class="sht">📊 Statistiques</h3><div class="seg2" style="margin-top:14px"><button data-act="rng" data-r="w" class="${stR==='w'?'on':''}">Cette semaine</button><button data-act="rng" data-r="m" class="${stR==='m'?'on':''}">Ce mois</button><button data-act="rng" data-r="y" class="${stR==='y'?'on':''}">Cette année</button></div>
 <div class="two"><div class="card"><p class="lbl">Accompli</p><div class="v">${pc} %</div></div><div class="card"><p class="lbl">Série</p><div class="v">${streak()} j</div></div></div>
 <div class="card"><p class="lbl">Jours récents</p><div style="display:flex;gap:5px;align-items:flex-end;height:80px">${bars.map(x=>`<div style="flex:1;height:${Math.max(6,Math.round(80*x))}px;background:var(--g);opacity:${.25+.75*x};border-radius:5px"></div>`).join('')||'<span class="sub">Pas encore de données.</span>'}</div></div>
 <div class="card">${hb('Cybersécurité',o.min.cyber,Math.max(60,o.min.cyber,o.min.en,o.min.etu),h(o.min.cyber))}${hb('Anglais',o.min.en,Math.max(60,o.min.cyber,o.min.en,o.min.etu),h(o.min.en))}${hb('Études',o.min.etu,Math.max(60,o.min.cyber,o.min.en,o.min.etu),h(o.min.etu))}${hb('Séances sport',o.sport,Math.max(3,o.sport),o.sport)}${hb('Culture',o.cult,Math.max(4,o.cult),o.cult+' j')}${hb('Objectifs faits',o.done,Math.max(1,o.tot),o.done)}</div>`}
function sheetCfg(){const c=S.p.cfg,T=(l,k)=>`<label class="f">${l}<input type="time" data-cfg="${k}" value="${c[k]}"></label>`;
 return`<h3 class="sht">Mes horaires</h3><p class="sub">Tout est modifiable : le planning se recalcule instantanément.</p>
 <div class="two">${T('Réveil','wake')}</div><div class="two">${T('Début des cours','cs')}${T('Fin des cours','ce')}</div>
 <p class="hd">Babysitting</p><div class="two">${T('Début','bs')}${T('Fin','be')}</div><div class="chips">${[0,1,2,3].map(i=>`<button class="chip ${c.baby.includes(i)?'on':''}" data-act="bd" data-d="${i}">${DL[i]}</button>`).join('')}</div>
 <p class="hd">Cours du samedi</p><div class="two">${T('Début','cor')}${T('Fin','core')}</div>
 <p class="hd">Séances de sport</p>`+['A','B','C'].map(k=>`<div class="two"><label class="f">${SESS[k].n}<select data-sd="${k}">${DL.map((d,i)=>`<option value="${i}" ${c.sd[k]===i?'selected':''}>${d}</option>`).join('')}</select></label><label class="f">Heure<input type="time" data-st="${k}" value="${c.st[k]}"></label></div>`).join('')}

 if(a==='osport')openS(sheetSport);else if(a==='oen')openS(sheetEn);else if(a==='ocy')openS(sheetCy);else if(a==='ocu')openS(sheetCu);else if(a==='oco')openS(sheetCo);

 else if(T.dataset.cfg){if(T.value){S.p.cfg[T.dataset.cfg]=T.value;save()}}
 else if(T.dataset.st){if(T.value){S.p.cfg.st[T.dataset.st]=T.value;save()}}
 else if(T.dataset.sd){S.p.cfg.sd[T.dataset.sd]=+T.value;save()}
 else if(['sa','sb','sc'].includes(i))sim();
 else if(['gn','gt','gd','gs','gm'].includes(i))gprev()});
render();
